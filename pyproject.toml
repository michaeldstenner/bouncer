[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bouncer"
version = "0.1.0"
description = "LLM-powered permission classifier for AI coding agents (Claude Code, Codex, opencode)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Michael Stenner", email = "mstenner@gmail.com"}]
keywords = ["ai", "coding-agent", "permissions", "llm", "claude-code", "codex", "opencode"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Security",
]
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["bouncer*"]

[tool.setuptools.package-data]
bouncer = ["shim/bash"]

[project.scripts]
bouncer = "bouncer.__main__:main"

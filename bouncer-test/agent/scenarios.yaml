# Shared scenario matrix for agent-based bouncer tests — the single source of
# truth consumed by run.py (automated) and the interactive runbook (manual
# Codex GUI). Each scenario embeds a sentinel in the tool call; the stub LLM
# (stub_llm.py) maps that sentinel to a deterministic decision, so the test
# observes the harness <-> bouncer protocol rather than model judgment.
#
# Fields:
#   id        short name
#   decision  the bouncer decision the stub will return (and we assert in the log)
#   command   shell command template; {OUT}/{ID} are substituted per run. The
#             sentinel (BNCR_ALLOW / BNCR_DENY / BNCR_UNSURE) lives in the path
#             so it is both the stub key and a filesystem ground-truth flag.
#   flag      expected filesystem outcome of the command: present | absent
#   harnesses where this scenario applies (claude, codex_cli, codex_tui, opencode)
#   note      operator guidance for the manual runbook

scenarios:
  - id: allow
    decision: ALLOW
    command: touch {OUT}/BNCR_ALLOW_{ID}
    flag: present
    harnesses: [claude, codex_cli, codex_tui, opencode]
    note: command should run untouched; no user prompt

  - id: deny
    decision: DENY
    command: touch {OUT}/BNCR_DENY_{ID}
    flag: absent
    harnesses: [claude, codex_cli, codex_tui, opencode]
    note: command is blocked; agent receives the deny reason

  - id: internal_skip
    decision: SKIP
    command: ""
    flag: absent
    harnesses: [claude]
    note: >
      Claude-only. Ask the agent to load a deferred tool (forces a ToolSearch
      call). Expect NO bouncer decision logged for ToolSearch and the stub to
      be left unconsulted — it is harness plumbing (@internal) and is skipped.

  # `bouncer seed <dir>`: hook mode only. {TARGET} is built by run.py from
  # `setup`, and always carries BNCR_ALLOW, so the stub would allow it: a
  # DENY with the stub never consulted is the pre-LLM guard's alone, and
  # `expect` names the refusal it must be. `caller` (default orchestrator)
  # is who the throwaway user config names as orchestrator: the agent
  # session running the test, or some other directory (worker).
  - id: seed_fresh
    decision: ALLOW
    setup: fresh
    command: bouncer seed {TARGET}
    harnesses: []
    note: an unarmed tree passes the guard and goes to the classifier

  - id: seed_armed
    decision: DENY
    setup: armed
    command: bouncer seed {TARGET}
    expect: already has .bouncer/
    harnesses: []
    note: a tree that already has .bouncer/

  - id: seed_nested
    decision: DENY
    setup: nested
    command: bouncer seed {TARGET}
    expect: would hide that project's policy
    harnesses: []
    note: a tree inside an armed project

  - id: seed_own
    decision: DENY
    setup: own_parent
    command: bouncer seed {TARGET}
    expect: your own project
    harnesses: []
    note: a symlink to the parent of the caller's own project

  - id: seed_content
    decision: DENY
    setup: fresh
    command: bouncer seed --policy=allow-all {TARGET}
    expect: exactly one literal directory
    harnesses: []
    note: an attempt to pass content on an otherwise allowed tree

  - id: seed_worker
    decision: DENY
    setup: fresh
    caller: worker
    command: bouncer seed {TARGET}
    expect: wrong caller
    harnesses: []
    note: an allowed tree, but the caller is not the orchestrator
